name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ruff==0.14.1
      - run: ruff check guardrails tests
      - run: python -m compileall -q guardrails tests
      - name: Engine, policy validation, hook contracts and security regressions
        run: python -m unittest discover -s tests -v
      - name: Twelve-scenario rubric (fixture evaluation, not agent efficacy)
        run: python -m guardrails evaluate-scenarios --trace tests/fixtures/scenarios.json
      - name: Real wheel and isolated project installation roundtrip
        run: python tests/integration/package_install.py
      - run: udg --help

  codex-host:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned real host in runner scratch directory
        run: npm install --prefix "$RUNNER_TEMP/udg-host" @openai/codex@0.160.0
      - name: Real host coverage, including denials and fail-open counterexamples
        run: python tests/integration/codex_host.py --suite coverage --codex "$RUNNER_TEMP/udg-host/node_modules/.bin/codex"
      - name: Development controls, explicit PROTECT and first-install default OBSERVE
        run: python tests/integration/codex_host.py --suite development --codex "$RUNNER_TEMP/udg-host/node_modules/.bin/codex"
